# Local override: which agent image manager-created sandboxes run.
#
# Compose merges this file automatically for every command run in this
# directory (`docker compose up --build`, `./verify.sh`, e2e-test/run.sh), so
# the setting survives `docker compose down` + `docker compose up --build`.
#
# RFC 0012 removed the AGENT_SECRETS_DIR lever: the manager no longer mounts
# host secrets into sandboxes. Users bring their own keys (BYOK) through the
# manager's /providers API; running the agent image standalone keeps the
# secret-file branch of agent/model.ts (see README).
services:
  sandbox-manager:
    environment:
      AGENT_IMAGE: ${AGENT_IMAGE-affido-agent:latest}
