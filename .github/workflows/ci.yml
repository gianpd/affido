name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify.sh (typecheck, unit, image gates, e2e, lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install gVisor (runsc) on the runner daemon
        # gVisor is mandatory (manager refuses to boot without the runsc
        # runtime), and ubuntu-latest has no runsc. systrap needs no /dev/kvm,
        # so it runs inside the GitHub VM. Registered as an additional runtime
        # -- NOT the default: the control plane stays on runc, mirroring the
        # dev daemon.json.
        #
        # Do not install from the apt channel with a dated pin: its Packages
        # index lists exactly one build (the newest), so `apt-get install
        # runsc=<date>` stops resolving the day the next gVisor release ships.
        # That broke CI twice. The archive pool keeps every build, so fetch the
        # pinned .deb directly and assert the installed version: a bad pin must
        # fail loudly, never silently run a different runtime.
        env:
          RUNSC_VERSION: "20261102.0"
        run: |
          curl -fsSL -o /tmp/runsc.deb \
            "https://storage.googleapis.com/gvisor/releases/pool/${RUNSC_VERSION}/binary-amd64/runsc.deb"
          sudo dpkg -i /tmp/runsc.deb
          runsc --version | grep -q "release-${RUNSC_VERSION}"
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; echo '{"runtimes":{"runsc":{"path":"/usr/bin/runsc"}}}'; } \
            | sudo jq -s '.[0] * .[1]' | sudo tee /tmp/daemon.json >/dev/null
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{range $k, $v := .Runtimes}}{{$k}} {{end}}' | grep -qw runsc

      - name: Run the full gate
        run: ./verify.sh

  frontend:
    name: frontend (svelte-check, lint, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No root package.json exists, so the action cannot infer the version
        # from a packageManager field: pin it explicitly. 10.28.0 matches the
        # local toolchain that produced pnpm-lock.yaml (lockfileVersion 9.0).
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        # Server project only: the browser-mode client project (scaffold
        # examples under src/lib/vitest-examples/) needs Playwright chromium
        # and stays local-only. Direct script because pnpm does not reliably
        # forward "-- --project server" args through test:unit.
        run: pnpm test:unit:server
