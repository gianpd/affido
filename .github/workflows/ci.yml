name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify.sh (typecheck, unit, image gates, e2e, lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the full gate
        run: ./verify.sh

  frontend:
    name: frontend (svelte-check, lint, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No root package.json exists, so the action cannot infer the version
        # from a packageManager field: pin it explicitly. 10.28.0 matches the
        # local toolchain that produced pnpm-lock.yaml (lockfileVersion 9.0).
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        # Server project only: the browser-mode client project (scaffold
        # examples under src/lib/vitest-examples/) needs Playwright chromium
        # and stays local-only ("pnpm test" runs it via the browser provider).
        run: pnpm test:unit -- --run --project server
