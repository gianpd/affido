{
	"name": "pi-durable-containers",
	"services": {
		"caddy": {
			"image": "caddy:2.11.4-alpine",
			"container_name": "caddy",
			"ports": ["18080:80"],
			"environment": {
				"MANAGER_TOKEN": "${MANAGER_TOKEN:-dev-manager-token}"
			},
			"volumes": ["./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"],
			"depends_on": ["sandbox-manager"],
			"restart": "unless-stopped",
			"networks": ["agents"]
		},
		"oltp": {
			"image": "postgres:17-alpine",
			"container_name": "oltp",
			"environment": {
				"POSTGRES_USER": "pi",
				"POSTGRES_PASSWORD": "pi",
				"POSTGRES_DB": "pi"
			},
			"ports": ["${OLTP_PORT:-15432}:5432"],
			"volumes": ["oltp-data:/var/lib/postgresql/data"],
			"healthcheck": {
				"test": ["CMD-SHELL", "pg_isready -U pi -d pi"],
				"interval": "2s",
				"timeout": "2s",
				"retries": 30
			},
			"restart": "unless-stopped",
			"networks": ["agents"]
		},
		"sandbox-manager": {
			"build": "./sandbox-manager",
			"container_name": "sandbox-manager",
			"environment": {
				"DATABASE_URL": "postgresql://pi:pi@oltp:5432/pi",
				"AGENT_IMAGE": "pi-durable-agent:latest",
				"MANAGER_TOKEN": "${MANAGER_TOKEN:-dev-manager-token}",
				"MANAGER_CONTAINER": "sandbox-manager",
				"CADDY_CONTAINER": "caddy",
				"WEB_CONTAINER": "${WEB_CONTAINER:-}",
				"STOP_AFTER_S": "${STOP_AFTER_S:-600}",
				"EVICT_TICK_S": "${EVICT_TICK_S:-15}",
				"AGENT_IDLE_MS": "${AGENT_IDLE_MS:-5000}",
				"AGENT_CITATIONS_DEFAULT": "${AGENT_CITATIONS_DEFAULT:-}"
			},
			"volumes": ["/var/run/docker.sock:/var/run/docker.sock"],
			"depends_on": { "oltp": { "condition": "service_healthy" } },
			"restart": "unless-stopped",
			"networks": ["agents"]
		}
	},
	"networks": {
		"agents": {
			"driver": "bridge"
		}
	},
	"volumes": {
		"oltp-data": {}
	}
}
